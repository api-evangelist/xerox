specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Xerox
providerId: xerox
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Print Services
  - Managed Print Services
  - Document Management
description: FinOps shape for Xerox is opaque. The Xerox Developer Program APIs are bundled with
  Xerox device, MPS, and print-service contracts, not sold as a separate metered API. Spend is
  recorded against MPS contracts (typically click-charges for printed pages) rather than
  per-API-call meters.
sources:
  - https://www.xerox.com/en-us/services/managed-print-services
  - https://publicprintapi.services.xerox.com/
notes: Xerox publishes no public API price list and no usage-billing API or FOCUS-aligned cost
  export. Meters reflect the underlying print-services billing model (per page / per device)
  rather than per-request API charges.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Xerox Holdings Corporation
serviceCategory: Managed Print Services
billingModel:
  pricingCategory: Subscription + Usage (click-charge)
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
focusColumns:
  ServiceName: Xerox
  ServiceCategory: Managed Print Services
  ProviderName: Xerox
  PublisherName: Xerox Holdings Corporation
  InvoiceIssuerName: Xerox Holdings Corporation
  BillingCurrency: USD
meters:
  - name: device_subscription
    unit: device-month
    aggregation: sum
    dimensions:
      - device_model
      - contract
  - name: pages_printed
    unit: page
    aggregation: sum
    dimensions:
      - device
      - color_mode
      - contract
principles:
  - name: Visibility
    description: Xerox MPS reporting (typically delivered through the customer's Xerox account
      manager and the MPS portal) shows per-device click counts; there is no separate per-API
      usage feed.
  - name: Allocation
    description: Costs allocate by device, location, and contract line; per-application
      attribution requires capturing the calling appid in client-side telemetry.
  - name: Optimization
    description: Levers are device fleet right-sizing, color-vs-mono routing, ConnectKey
      workflow consolidation, and renegotiating click-rates at renewal rather than API-side
      tuning.
  - name: Accountability
    description: Print services contract is owned by IT / facilities procurement; integration
      teams own the Developer Program appid and the printer-side workflows that drive volume.
