apis:
- aid: xerox:xerox-managed-print-services-api
  name: Xerox Managed Print Services API
  description: >-
    The Xerox MPS-API and Support Assistant API (SA-API) provide a secure common interface allowing third
    parties to access features in the Xerox hosted technology suite for managed print services. Based
    on standard Web Service technologies supporting fleet management, device monitoring, supply replenishment,
    and service request automation.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.xerox.com/en-us/about/developer-program
  tags:
  - Fleet Management
  - Managed Print Services
  - Monitoring
  - Print Management
  properties:
  - type: Documentation
    url: https://www.xerox.com/en-us/about/developer-program
- aid: xerox:xerox-extensible-interface-platform
  name: Xerox Extensible Interface Platform (EIP)
  description: >-
    SDK and API framework for building custom applications that run directly on Xerox ConnectKey-enabled
    multifunction printers and compatible devices. Apps are deployed through the Xerox App Gallery and
    can integrate device capabilities including scanning, printing, and workflow automation. Includes
    the Xerox App Developer Kit for ConnectKey applications.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.xerox.com/en-us/about/developer-program
  tags:
  - App Development
  - ConnectKey
  - Multifunction Printer
  - SDK
  properties:
  - type: Documentation
    url: https://www.xerox.com/en-us/about/developer-program
  - type: AppGallery
    url: https://appgallery.services.xerox.com
- aid: xerox:xerox-freeflow-api
  name: Xerox FreeFlow SDK
  description: >-
    Software development kit for integrating with the Xerox FreeFlow production printing platform. Includes
    interfaces for Prepress, Press, Variable Information (VIPP), and Photo modules enabling custom workflow
    automation for high-volume production printing environments.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.xerox.com/en-us/about/developer-program
