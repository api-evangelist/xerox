aid: xerox
name: Xerox
description: >-
  Xerox is a global technology company and document management leader providing printing, digital document management,
  and business process solutions. Xerox offers the Xerox Developer Program providing open, standards-based APIs for
  integration with ConnectKey multifunction printers, FreeFlow production printing, Managed Print Services (MPS), and
  the Xerox Public Print Service. The program provides SDKs, APIs, and tools for building custom printing applications,
  workflow integrations, and enterprise print management solutions.
