specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Xerox
providerId: xerox
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Print Services
  - Document Management
description: Xerox does not publish numeric rate limits for its Public Print, MPS, ConnectKey
  EIP, or FreeFlow APIs on any unauthenticated developer page. Access is gated by the Xerox
  Global Developer Program; rate-limit policy is shared with onboarded developers via the
  program rather than published openly. Most workloads are device-scoped (per multifunction
  printer) rather than high-frequency cloud reads.
sources:
  - https://publicprintapi.services.xerox.com/
  - https://www.support.xerox.com/
limits:
  - name: Developer Program-scoped throttling (numbers not publicly documented)
    scope: appid
    metric: varies
    limit: see Xerox Global Developer Program documentation after onboarding
    notes: Xerox APIs require xrxauth, user-email, and appid headers; effective rate ceilings
      are issued per registered application during developer-program onboarding.
  - name: Device-scoped print job submission
    scope: device
    metric: varies
    limit: bound by physical device throughput
    notes: ConnectKey EIP and Public Print workflows are constrained by the print-engine
      throughput of the target multifunction printer, not by a centralized cloud quota.
policies:
  - name: Onboarding required
    description: Developer applications must register through the Xerox Global Developer Program
      to receive an appid and the limits documentation that goes with it.
  - name: Authentication
    description: All secure calls require xrxauth, user-email, and appid headers. Throttling is
      keyed on the appid issued during onboarding.
  - name: Backoff
    description: Standard guidance is exponential backoff with jitter on HTTP 429 / 503
      responses.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
    url: https://apievangelist.com
