naftiko: 1.0.0-alpha2
info:
  label: Xerox Public Print API — EULA
  description: 'Xerox Public Print API — EULA. 3 operations. Lead operation: Get Provider EULA. Self-contained Naftiko capability
    covering one Xerox business surface.'
  tags:
  - Xerox
  - EULA
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    XEROX_API_KEY: XEROX_API_KEY
capability:
  consumes:
  - type: http
    namespace: public-print-eula
    baseUri: https://publicprintapi.services.xerox.com/api/v1
    description: Xerox Public Print API — EULA business capability. Self-contained, no shared references.
    resources:
    - name: EULA
      path: /EULA
      operations:
      - name: geteula
        method: GET
        description: Get Provider EULA
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: providerId
          in: query
          type: string
          description: The unique identifier of the provider
          required: true
      - name: createorupdateeula
        method: POST
        description: Create or Update Provider EULA
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: EULA-Agree
      path: /EULA/Agree
      operations:
      - name: agreetoeula
        method: PUT
        description: Agree To EULA
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: providerId
          in: query
          type: string
          description: The unique identifier of the provider
          required: true
    authentication:
      type: apikey
      key: xrxauth
      value: '{{env.XEROX_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: public-print-eula-rest
    port: 8080
    description: REST adapter for Xerox Public Print API — EULA. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/eula
      name: eula
      description: REST surface for EULA.
      operations:
      - method: GET
        name: geteula
        description: Get Provider EULA
        call: public-print-eula.geteula
        with:
          providerId: rest.providerId
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createorupdateeula
        description: Create or Update Provider EULA
        call: public-print-eula.createorupdateeula
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/eula/agree
      name: eula-agree
      description: REST surface for EULA-Agree.
      operations:
      - method: PUT
        name: agreetoeula
        description: Agree To EULA
        call: public-print-eula.agreetoeula
        with:
          providerId: rest.providerId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: public-print-eula-mcp
    port: 9090
    transport: http
    description: MCP adapter for Xerox Public Print API — EULA. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-provider-eula
      description: Get Provider EULA
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: public-print-eula.geteula
      with:
        providerId: tools.providerId
      outputParameters:
      - type: object
        mapping: $.
    - name: create-update-provider-eula
      description: Create or Update Provider EULA
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: public-print-eula.createorupdateeula
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: agree-eula
      description: Agree To EULA
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: public-print-eula.agreetoeula
      with:
        providerId: tools.providerId
      outputParameters:
      - type: object
        mapping: $.
