  tags:
  - Xerox
  - Providers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    XEROX_API_KEY: XEROX_API_KEY
capability:
  consumes:
  - type: http
    namespace: public-print-providers
    baseUri: https://publicprintapi.services.xerox.com/api/v1
    description: Xerox Public Print API — Providers business capability. Self-contained, no shared references.
    resources:
    - name: Provider
      path: /Provider
      operations:
      - name: createprovider
        method: PUT
        description: Create Provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: updateprovider
        method: POST
        description: Update Provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: getprovider
        method: GET
        description: Get Provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: query
          type: string
          description: The unique identifier of the provider
          required: true
    - name: Provider-Delete
      path: /Provider/Delete
      operations:
      - name: deleteprovider
        method: DELETE
        description: Delete Provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: query
          type: string
          description: The unique identifier of the provider to delete
          required: true
    - name: Provider-Search
      path: /Provider/Search
      operations:
      - name: searchproviders
        method: GET
        description: Search Providers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
          description: Provider name to search for
        - name: $skip
          in: query
          type: integer
        - name: $take
          in: query
          type: integer
    authentication:
      type: apikey
      key: xrxauth
      value: '{{env.XEROX_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: public-print-providers-rest
    port: 8080
    description: REST adapter for Xerox Public Print API — Providers. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/provider
      name: provider
      description: REST surface for Provider.
      operations:
      - method: PUT
        name: createprovider
        description: Create Provider
        call: public-print-providers.createprovider
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: updateprovider
        description: Update Provider
        call: public-print-providers.updateprovider
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getprovider
        description: Get Provider
        call: public-print-providers.getprovider
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/provider/delete
      name: provider-delete
      description: REST surface for Provider-Delete.
      operations:
      - method: DELETE
        name: deleteprovider
        description: Delete Provider
        call: public-print-providers.deleteprovider
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/provider/search
      name: provider-search
