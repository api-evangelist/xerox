    port: 9090
    transport: http
    description: MCP adapter for Xerox Public Print API — Providers. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: create-provider
      description: Create Provider
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: public-print-providers.createprovider
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: update-provider
      description: Update Provider
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: public-print-providers.updateprovider
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-provider
      description: Get Provider
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: public-print-providers.getprovider
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-provider
      description: Delete Provider
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: public-print-providers.deleteprovider
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: search-providers
      description: Search Providers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: public-print-providers.searchproviders
      with:
        name: tools.name
        $skip: tools.$skip
        $take: tools.$take
      outputParameters:
      - type: object
        mapping: $.
