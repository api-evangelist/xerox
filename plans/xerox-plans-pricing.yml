description: Xerox does not publish list pricing for its API surface or its Managed Print
  Services. The Xerox Developer Program (Public Print API, MPS API, ConnectKey EIP, FreeFlow
  SDK) is provided to Xerox customers and integration partners under a developer-program
  agreement; commercial pricing is bundled with Xerox device, MPS, or print-service contracts
  negotiated via direct sales.
