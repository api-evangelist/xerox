notes: Xerox publishes no API price list or self-serve plan tiers. The MPS landing page directs
  prospects to "1-800-275-9376 ext 947" or a contact form for quotes. Trimmed to a single
  Contact Sales / Developer Program plan pending direct vendor confirmation.
